name: VideoMerger
options:
  bundleIdPrefix: tw.ultima6
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

targets:
  VideoMerger:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.ultima6.videomerger
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
